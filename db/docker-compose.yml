version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: urban_crime_db
    environment:
      POSTGRES_DB: urban_crime
      POSTGRES_USER: erfan
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erfan -d urban_crime"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
