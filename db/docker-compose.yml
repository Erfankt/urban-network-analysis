version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: urban_crime_db
    environment:
      POSTGRES_DB: urban_crime
      POSTGRES_USER: erfan
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erfan -d urban_crime"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: urban_crime_api
    environment:
      DB_HOST: postgis
      DB_PORT: 5432        # internal Docker network; postgis container listens on 5432
      DB_NAME: urban_crime
      DB_USER: erfan
      DB_PASS: localdev
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    restart: on-failure

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: urban_crime_dashboard
    environment:
      # Internal Docker DNS — dashboard talks to the api container directly
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: on-failure

volumes:
  pgdata:
